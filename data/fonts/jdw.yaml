hugoblox:
  meta:
    format: "hugoblox-font@1"
    name: "JDW Korean"
    vendor: "jdwblog"
    version: "1.0.0"
    license: "OFL-1.1"
    description: "Korean-first typography based on the legacy JDW font set"

  style: "sans"

  families:
    heading: "Noto Sans KR"
    body: "Noto Sans KR"
    nav: "Noto Sans KR"
    code: "JetBrains Mono"

  weights:
    heading: [700, 800]
    body: [400, 700]
    nav: [500, 700]
    code: [400, 700]

  sizes:
    base: "clamp(1.05rem, 0.98rem + 0.24vw, 1.22rem)"
    sm: "0.875rem"
    lg: "1.25rem"

  leading:
    heading: 1.3
    body: 1.6
    code: 1.55

  tracking:
    heading: "-0.015em"
    body: "0"
    caps: "0.04em"

  variable:
    heading: true
    body: true
    nav: true
    code: true
