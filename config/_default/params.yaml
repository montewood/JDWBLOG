hugoblox:
  schema: "2.0"

  identity:
    name: "JDW BLOG"
    organization: ""
    type: person
    tagline: "Engineering-Focused Data Analyst"
    description: "R, Python, cloud engineering, deep learning과 데이터 제품을 다루는 JDW의 기술 블로그입니다."
    social: {}

  theme:
    mode: system
    pack: jdw
    colors:
      neutral: slate

  typography:
    pack: jdw

  layout:
    radius: md
    spacing: spacious
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: right
    search: true
    theme_toggle: true
    theme_picker: false
    language_switcher: false
    cta:
      enable: false

  footer:
    style: minimal
    language_switcher: false
    text: "[개인정보 및 쿠키 안내](/privacy/)"

  copyright:
    notice: "© {year} JDW. This work is licensed under {license}"
    license:
      type: cc
      allow_derivatives: true
      share_alike: true
      allow_commercial: false

  seo:
    title: "JDW Blog"
    ai:
      allow:
        - /
      disallow: []
      contact: "jdwnovember@gmail.com"

  content:
    math:
      enable: true
    toc:
      enable: true
    reading_time:
      enable: true
    citations:
      style: apa

  search:
    enable: true
    suggestions:
      - R
      - Python
      - Data Engineering

  comments:
    enable: false
    provider: ""

  analytics:
    google:
      measurement_id: ""
    google_tag_manager:
      container_id: "GTM-P8STCFM"

  verification:
    google: ""
    naver: ""

  repository:
    enable: true
    url: "https://github.com/montewood/JDWBLOG"
    branch: main
    content_dir: content

  locale:
    date_format: "2006-01-02"
    time_format: "15:04"
    address_format: en-us

  security:
    frame_options: allow

  privacy:
    enable: false
    anonymize_analytics: true

  debug:
    enable: false

  pro:
    hide_attribution: false

# JDW design system settings (project-owned, outside the hugoblox schema)
jdw:
  # An empty list hides the filter bar entirely; only one published project remains.
  project_filters: []
