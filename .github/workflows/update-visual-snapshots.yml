name: Update visual snapshots

# Playwright baselines encode the runner's font rendering, so regenerating them
# anywhere other than the image check:visual runs on produces mismatches.

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Playwright -g filter, e.g. projects. Leave blank to check every snapshot."
        required: false
        default: ""
  # workflow_dispatch only registers once this file reaches the default branch,
  # so the label gives a pull request branch a way to run it before that.
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  snapshots:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-snapshots'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.5"
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.162.0"
          extended: true
      - uses: pnpm/action-setup@v4
        with:
          version: "10.14.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/validate-site.sh
      - run: pnpm run pagefind
      - run: pnpm exec playwright install --with-deps chromium
      - name: Regenerate snapshots
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          if [ -n "${TEST_FILTER}" ]; then
            pnpm exec playwright test --update-snapshots -g "${TEST_FILTER}"
          else
            pnpm run check:visual:update
          fi
      - name: Commit updated snapshots
        # Without this a single unrelated assertion failure discards every
        # baseline the run already regenerated.
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- tests/visual; then
            echo "Snapshots are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual
          git commit -m "update visual snapshots for ${TARGET_BRANCH}"
          # A GITHUB_TOKEN push does not start new workflow runs, so re-run the
          # failing check manually to see it pass against these baselines.
          git push origin "HEAD:${TARGET_BRANCH}"
