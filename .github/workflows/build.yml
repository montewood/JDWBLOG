name: Validate HugoBlox site

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - migration/hugoblox

permissions:
  contents: read

jobs:
  hugo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.5"
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.162.0"
          extended: true
      - uses: pnpm/action-setup@v4
        with:
          version: "10.14.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/validate-site.sh
      - run: pnpm run pagefind
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check:visual

  quarto-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Public RSPM serves prebuilt Ubuntu binaries, so fs and its dependents
      # no longer need libuv and other headers absent from the runner.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rendering dependencies
        # The repo .Rprofile pins repos to source-only CRAN and R reads it after
        # setup-r, so without this every package compiles and fails on missing
        # headers. install.packages only warns on failure, so assert afterwards
        # instead of letting a missing package surface later as a render error.
        run: |
          Rscript -e '
            rspm <- Sys.getenv("RSPM")
            if (nzchar(rspm)) options(repos = c(RSPM = rspm))
            pkgs <- c("rmarkdown", "gapminder", "ggplot2", "plotly", "leaflet", "reticulate")
            install.packages(pkgs)
            missing <- pkgs[!pkgs %in% rownames(installed.packages())]
            if (length(missing)) {
              stop("R packages failed to install: ", paste(missing, collapse = ", "))
            }
          '
          python -m pip install numpy matplotlib ipyleaflet
      - name: Run scripts/check-quarto-drift.sh
        # Left alone, reticulate provisions its own uv-managed interpreter and
        # resolves only numpy from the chunk, so the .qmd dies on matplotlib.
        # Pin it to the interpreter the step above actually installed into.
        env:
          RETICULATE_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: scripts/check-quarto-drift.sh
