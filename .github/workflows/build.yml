name: Validate HugoBlox site

on:
  pull_request:
  push:
    branches:
      - main
      - migration/hugoblox

permissions:
  contents: read

jobs:
  hugo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.5"
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.162.0"
          extended: true
      - uses: pnpm/action-setup@v4
        with:
          version: "10.14.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/validate-site.sh
      - run: pnpm run pagefind
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check:visual

  quarto-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rendering dependencies
        run: |
          Rscript -e 'install.packages(c("gapminder", "ggplot2", "plotly", "leaflet", "reticulate"))'
          python -m pip install numpy matplotlib ipyleaflet
      - run: scripts/check-quarto-drift.sh
