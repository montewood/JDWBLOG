</div>
<script>
  (() => {
    document.querySelectorAll('.jdw-project-filters').forEach((bar) => {
      const grid = bar.nextElementSibling;
      if (!grid || !grid.classList.contains('jdw-project-grid')) return;
      bar.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-filter]');
        if (!button) return;
        bar.querySelectorAll('button').forEach((candidate) => {
          candidate.classList.toggle('is-active', candidate === button);
        });
        const filter = button.dataset.filter;
        grid.querySelectorAll('[data-tags]').forEach((card) => {
          const tags = card.dataset.tags.split(',');
          card.hidden = filter !== '*' && !tags.includes(filter);
        });
      });
    });
  })();
</script>
